# Configuración de pain_radar. Edita nichos, consultas y subreddits a tu gusto.
# Comprueba que los subreddits existen y tienen actividad: los nombres son ejemplos.

[ollama]
host = "http://localhost:11434"
llm_model = "qwen2.5:7b-instruct"   # prueba qwen2.5:3b-instruct si tu equipo va lento
embed_model = "nomic-embed-text"
# think = false                     # descomenta solo si usas un modelo con modo "thinking" (p. ej. qwen3)

[collect]
days = 365            # antigüedad máxima de los textos
hn_pages = 2          # páginas de 50 resultados por consulta en Hacker News
reddit_limit = 100    # posts por consulta y subreddit

[analysis]
min_chars = 80        # descarta textos más cortos
max_chars = 1500      # trunca textos más largos antes de enviarlos al LLM
cluster_distance = 0.35   # menor = clusters más estrictos; mayor = más agrupados
min_cluster_size = 3
top_clusters = 25     # clusters que se etiquetan y salen en el informe

[[niches]]
name = "hosteleria"
queries = [
  "restaurant staff scheduling nightmare",
  "restaurant food waste inventory problem",
  "fast food employee turnover training",
  "restaurant spreadsheet manual process",
]
subreddits = ["restaurateur", "KitchenConfidential", "smallbusiness"]

[[niches]]
name = "autonomos"
queries = [
  "freelancer invoicing chasing late payments",
  "freelance accounting expenses spreadsheet",
  "self-employed taxes paperwork frustrating",
  "e-invoicing compliance small business",
]
subreddits = ["freelance", "smallbusiness", "Entrepreneur"]

[[niches]]
name = "pymes_servicios"
queries = [
  "clinic appointment no-shows reminders",
  "small business answering customer calls whatsapp",
  "gym studio membership admin software frustrating",
  "small business too many manual tasks automate",
]
subreddits = ["smallbusiness", "Entrepreneur", "fitnessbusiness"]

